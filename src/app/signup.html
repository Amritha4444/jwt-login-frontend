<div class="signup-page">
  <div class="signup-card">
    <div class="brand-icon">A</div><h1>Create your account</h1>
<p class="subtitle">Join us by filling in your details below.</p>

<form #signupForm="ngForm" (ngSubmit)="onSignup()" novalidate>
  <div class="form-group">
    <label for="email">Email address</label>
    <input
      id="email"
      type="email"
      name="email"
      [(ngModel)]="email"
      #emailField="ngModel"
      required
      email
      placeholder="you@example.com"
      autocomplete="email"
    />
    <small class="field-error"
      *ngIf="emailField.invalid && emailField.touched">
      Enter a valid email address.
    </small>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="password"
      #passwordField="ngModel"
      required
      minlength="8"
      placeholder="At least 8 characters"
      autocomplete="new-password"
    />
    <small class="field-error"
      *ngIf="passwordField.invalid && passwordField.touched">
      Use at least 8 characters.
    </small>
  </div>

  <div class="form-group">
    <label for="confirmPassword">Confirm password</label>
    <input
      id="confirmPassword"
      type="password"
      name="confirmPassword"
      [(ngModel)]="confirmPassword"
      #confirmPasswordField="ngModel"
      required
      placeholder="Enter your password again"
      autocomplete="new-password"
    />
    <small class="field-error"
      *ngIf="confirmPasswordField.touched && password !== confirmPassword">
      Passwords do not match.
    </small>
  </div>

  <div class="message error-message" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="message success-message" *ngIf="successMessage">
    {{ successMessage }}
  </div>

  <button
    class="signup-button"
    type="submit"
    [disabled]="isLoading || signupForm.invalid || password !== confirmPassword">
    {{ isLoading ? 'Creating account...' : 'Create account' }}
  </button>
</form>

<p class="login-prompt">
  Already have an account?
  <a routerLink="/login">Log in</a>
</p>

  </div>
</div>
