<h2>Login</h2>

<input
  type="email"
  [(ngModel)]="email"
  name="email"
  placeholder="Email"
  required
>

<br><br>

<input
  type="password"
  [(ngModel)]="password"
  name="password"
  placeholder="Password"
  required
>

<br><br>

<button
  type="button"
  (click)="login()"
>
  LOGIN
</button>
